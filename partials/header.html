<!-- Shared header (homepage and subpages). Edit partials/header.html, then run python3 tools/build.py. -->
<a href="#main-content" class="skip-link">{{t:Skip to main content}}</a>

<header class="site-header">
  <div class="nav-wrap">
    <nav class="nav glass" aria-label="{{t:Primary}}">
      <a href="/" class="wordmark" aria-label="{{t:Noxium home}}">Noxium<span aria-hidden="true">.</span></a>

      <div class="nav-links">
        <a href="/#features">{{t:Features}}</a>
        <a href="/#security">{{t:Security}}</a>
        <a href="/#pricing">{{t:Pricing}}</a>
        <a href="/best-photo-vault-apps-iphone">{{t:Compare}}</a>
        <a href="/guides/">{{t:Guides}}</a>
      </div>

      <div class="nav-actions">
        <a href="/#waitlist" class="btn btn-ink btn-nav nav-cta" data-cta="nav" data-label-waitlist="{{t:Join the beta}}" data-label-live="{{t:Get Noxium}}">{{t:Join the beta}}</a>
        <button type="button" class="mobile-menu-btn" id="mobile-menu-btn" aria-expanded="false" aria-controls="mobile-drawer" aria-label="{{t:Menu}}">
          <svg class="icon icon-menu" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg>
          <svg class="icon icon-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </nav>
  </div>

  <div class="mobile-drawer glass" id="mobile-drawer" hidden>
    <nav class="mobile-drawer-list" aria-label="{{t:Mobile}}">
      <a href="/#features">{{t:Features}}</a>
      <a href="/#security">{{t:Security}}</a>
      <a href="/#pricing">{{t:Pricing}}</a>
      <a href="/best-photo-vault-apps-iphone">{{t:Compare vault apps}}</a>
      <a href="/guides/">{{t:Guides}}</a>
      <a href="/about">{{t:About}}</a>
      <a href="/support">{{t:Support}}</a>
    </nav>
  </div>
</header>
