<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="Noxium">
  <defs>
    <linearGradient id="drChassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#28211D"/>
      <stop offset="0.55" stop-color="#191412"/>
      <stop offset="1" stop-color="#0E0B09"/>
    </linearGradient>
  </defs>
  <rect width="180" height="180" rx="40" fill="url(#drChassis)"/>
  <rect x="2" y="2" width="176" height="176" rx="38" fill="none" stroke="#3D332C" stroke-width="2" opacity="0.7"/>
  <!-- 5x5 Bolt Matrix (25 Bolts) -->
  <g fill="#433932" stroke="#574B42" stroke-width="1.5">
    <!-- Row 1 (y=38) -->
    <circle cx="38" cy="38" r="8.5"/>
    <circle cx="64" cy="38" r="8.5"/>
    <circle cx="90" cy="38" r="8.5"/>
    <circle cx="116" cy="38" r="8.5"/>
    <!-- (142,38) is active -->
    <!-- Row 2 (y=64) -->
    <circle cx="38" cy="64" r="8.5"/>
    <circle cx="64" cy="64" r="8.5"/>
    <!-- (90,64) and (116,64) are active -->
    <circle cx="142" cy="64" r="8.5"/>
    <!-- Row 3 (y=90) -->
    <circle cx="38" cy="90" r="8.5"/>
    <!-- (64,90) is active -->
    <circle cx="90" cy="90" r="8.5"/>
    <circle cx="116" cy="90" r="8.5"/>
    <circle cx="142" cy="90" r="8.5"/>
    <!-- Row 4 (y=116) -->
    <circle cx="38" cy="116" r="8.5"/>
    <!-- (64,116) is active -->
    <circle cx="90" cy="116" r="8.5"/>
    <circle cx="116" cy="116" r="8.5"/>
    <circle cx="142" cy="116" r="8.5"/>
    <!-- Row 5 (y=142) -->
    <!-- (38,142) is active -->
    <circle cx="64" cy="142" r="8.5"/>
    <circle cx="90" cy="142" r="8.5"/>
    <circle cx="116" cy="142" r="8.5"/>
    <circle cx="142" cy="142" r="8.5"/>
  </g>
  <!-- Safelight Pattern Trace: (0,4) -> (1,3) -> (1,2) -> (2,1) -> (3,1) -> (4,0) -->
  <path d="M38 142 L64 116 L64 90 L90 64 L116 64 L142 38" fill="none" stroke="#F04E37" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 6 Active Safelight Bolts -->
  <g fill="#F04E37">
    <circle cx="38" cy="142" r="9"/>
    <circle cx="64" cy="116" r="9"/>
    <circle cx="64" cy="90" r="9"/>
    <circle cx="90" cy="64" r="9"/>
    <circle cx="116" cy="64" r="9"/>
    <circle cx="142" cy="38" r="10.5"/>
  </g>
</svg>
