<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 100 100" role="img" aria-label="Noxium">
  <!-- Website mark / favicon · B "Orbit". Rounded like the iOS icon; follows the browser's light/dark setting. -->
  <style>
    .bg-dark { display: inline; }
    .bg-light { display: none; }
    .ink { fill: #FFFFFF; stroke: #FFFFFF; }
    .glow { display: inline; }
    .idle { stroke-opacity: 0.42; }
    @media (prefers-color-scheme: light) {
      .bg-dark { display: none; }
      .bg-light { display: inline; }
      .ink { fill: #111111; stroke: #111111; }
      .glow { display: none; }
      .idle { stroke-opacity: 0.36; }
    }
  </style>
  <defs>
    <radialGradient id="nxBgDark" cx="50" cy="40" r="78.1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1C1C22"/>
      <stop offset="0.72" stop-color="#000000"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="nxBgLight" cx="50" cy="40" r="78.1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.85" stop-color="#F1EEE7"/>
      <stop offset="1" stop-color="#F1EEE7"/>
    </radialGradient>
  </defs>
  <rect class="bg-dark" width="100" height="100" rx="22.37" fill="url(#nxBgDark)"/>
  <rect class="bg-light" width="100" height="100" rx="22.37" fill="url(#nxBgLight)"/>
  <circle class="ink idle" cx="50" cy="50" r="33" fill="none" style="fill: none" stroke-width="0.6"/>
  <circle class="ink idle" cx="73.3" cy="26.7" r="2.4" style="fill: none" stroke-width="0.8"/>
  <circle class="ink glow" cx="50" cy="50" r="23" style="stroke: none" fill-opacity="0.07"/>
  <circle class="ink glow" cx="50" cy="50" r="18" style="stroke: none" fill-opacity="0.16"/>
  <circle class="ink" cx="50" cy="50" r="16.5" style="fill: none" stroke-opacity="0.16" stroke-width="1"/>
  <circle class="ink" cx="50" cy="50" r="12.5" style="stroke: none"/>
</svg>
